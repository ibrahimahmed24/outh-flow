version: "3.8"

services:
  auth-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: my_node_app

    ports:
      - "3001:3000"

    depends_on:
      - postgres

    env_file:
      - ./.env

  postgres:
    image: postgres:13
    container_name: my_postgres_db

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
